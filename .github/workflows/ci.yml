name: CI / Build & Smoke Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Start server (background)
        run: |
          nohup npm start > server.log 2>&1 &
          sleep 2

      - name: Smoke tests
        run: |
          curl -fsS http://localhost:3000/ || (cat server.log && exit 1)
          curl -fsS http://localhost:3000/index.html || (cat server.log && exit 1)
          curl -fsS http://localhost:3000/catalog.html || (cat server.log && exit 1)
          curl -fsS http://localhost:3000/profile.html || (cat server.log && exit 1)
          curl -fsS -X POST -H "Content-Type: application/json" -d '{"message":"привет"}' http://localhost:3000/api/chat || (cat server.log && exit 1)

      - name: Create release artifact
        uses: actions/upload-artifact@v4
        with:
          name: luxdrive-archive
          path: |
            index.html
            catalog.html
            profile.html
            style.css
            script.js
            server.js
            package.json
            Dockerfile
            Procfile
            README.md
